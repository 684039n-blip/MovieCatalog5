name: Setup and Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            rm -f README.md
            unzip -o "$ZIP_FILE"
            rm -f "$ZIP_FILE"
          else
            echo "No ZIP file found, using existing files"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo 'TMDB_BEARER_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxMzRjYTA1NDlmZTZjY2RmOTkyYWVkZGMyYmZiMzlmNiIsIm5iZiI6MTc3NzIyMTIwOC4wMjU5OTk4LCJzdWIiOiI2OWVlM2U1OGQzNThmMDhjNDUyOGRjZTAiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.CKXcYHhcQHKW3tIuDViHCQwAu6-hh--hoopAnDUeIUM' >> local.properties
          echo 'TMDB_API_KEY=134ca0549fe6ccdf992aeddc2bfb39f6' >> local.properties

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, creating wrapper..."
            mkdir -p gradle/wrapper
            printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
            curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://github.com/nicoulaj/gradle-wrapper/raw/master/gradle/wrapper/gradle-wrapper.jar"
            printf '#!/bin/sh\nAPP_HOME=$( cd "${0%/*}" > /dev/null && pwd -P ) || exit\nCLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar\nexec java -Xmx2g -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieCatalog-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
